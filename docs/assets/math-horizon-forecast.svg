<svg xmlns="http://www.w3.org/2000/svg" width="900" height="265" viewBox="0 0 900 265"><defs><linearGradient id="f" x2="1" y2="1"><stop stop-color="#0b1d37"/><stop offset="1" stop-color="#25194c"/></linearGradient></defs><rect width="900" height="265" rx="24" fill="url(#f)"/><g font-family="Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="21" font-weight="700">06 / Separate supervised forecasting experiment</text><text x="32" y="66" fill="#ccd9f1" font-size="14">A different question: does the supplied Challenge label enter its positive window in the next H hourly rows?</text><g transform="translate(40 97)"><text x="0" y="0" fill="#fff" font-size="14" font-weight="700">Current row</text><rect x="0" y="16" width="58" height="34" rx="7" fill="#1b6b7e"/><text x="29" y="38" fill="#fff" font-size="13" text-anchor="middle">Yₜ=0</text><text x="0" y="77" fill="#b8eae6" font-size="12">Forecast starts</text><text x="0" y="92" fill="#b8eae6" font-size="12">only while Yₜ=0</text></g><path d="M113 130h30m-9 -8 9 8-9 8" fill="none" stroke="#72eade" stroke-width="4"/><g transform="translate(151 97)"><text x="0" y="0" fill="#fff" font-size="14" font-weight="700">Future label window</text><g><rect x="0" y="16" width="47" height="34" rx="6" fill="#27365f"/><rect x="53" y="16" width="47" height="34" rx="6" fill="#27365f"/><rect x="106" y="16" width="47" height="34" rx="6" fill="#7a2f65"/><rect x="159" y="16" width="47" height="34" rx="6" fill="#9b406a"/><rect x="212" y="16" width="47" height="34" rx="6" fill="#c15e81"/></g><g fill="#fff" font-size="12" text-anchor="middle"><text x="23" y="37">t+1</text><text x="76" y="37">t+2</text><text x="129" y="37">…</text><text x="182" y="37">t+H</text><text x="235" y="37">Y=1?</text></g><text x="0" y="78" fill="#d2d9f2" font-size="12">H = 1, 3, or 6 rows</text></g><path d="M420 130h32m-9 -8 9 8-9 8" fill="none" stroke="#72eade" stroke-width="4"/><g transform="translate(460 97)"><rect width="170" height="93" rx="14" fill="#142943" stroke="#c0a5ff" stroke-width="2"/><text x="85" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">FEATURES</text><text x="85" y="51" fill="#d9ccff" font-size="13" text-anchor="middle">static + temporal</text><text x="85" y="70" fill="#d9ccff" font-size="13" text-anchor="middle">patient-disjoint split</text></g><path d="M641 130h30m-9 -8 9 8-9 8" fill="none" stroke="#72eade" stroke-width="4"/><g transform="translate(678 97)"><rect width="183" height="93" rx="14" fill="#142943" stroke="#ff8ab5" stroke-width="2"/><text x="91" y="29" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">LOGISTIC MODEL</text><text x="91" y="52" fill="#ffd1e2" font-size="13" text-anchor="middle">retrospective output</text><text x="91" y="71" fill="#ffd1e2" font-size="13" text-anchor="middle">not live twin output</text></g><text x="32" y="222" fill="#d4dcf4" font-size="13">The challenge label already uses a six-hour lead convention; this is not independently adjudicated sepsis onset.</text><text x="32" y="244" fill="#ffc7d7" font-size="12">Model probability is not established as calibrated or clinically actionable; Set B is evaluation-only.</text></g></svg>
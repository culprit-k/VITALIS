<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs><linearGradient id="z" x2="1" y2="1"><stop stop-color="#071d35"/><stop offset="1" stop-color="#063e53"/></linearGradient></defs><rect width="900" height="260" rx="24" fill="url(#z)"/><g font-family="Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="21" font-weight="700">02 / Standardise the deviation</text><text x="32" y="67" fill="#c7e5f2" font-size="14">Compare today's value with this channel's own past, measured in robust scale units.</text><path d="M64 154H480" stroke="#42647e" stroke-width="3"/><path d="M115 140V170M190 140V170M265 140V170M340 140V170M415 140V170" stroke="#42647e" stroke-width="2"/><circle cx="265" cy="154" r="8" fill="#b9a1ff"/><text x="265" y="194" fill="#d8ccff" text-anchor="middle" font-size="13">baseline m</text><circle cx="415" cy="154" r="10" fill="#ff91bb"><animate attributeName="r" values="8;12;8" dur="1.3s" repeatCount="indefinite"/></circle><path d="M275 125H405" stroke="#ff9bc5" stroke-width="3" stroke-dasharray="6 5"/><path d="M395 117l10 8-10 8" fill="none" stroke="#ff9bc5" stroke-width="3"/><text x="340" y="111" fill="#ffb4d0" text-anchor="middle" font-size="13">difference x − m</text><text x="415" y="194" fill="#ffd6e5" text-anchor="middle" font-size="13">current x</text><g transform="translate(530 94)"><rect width="330" height="104" rx="18" fill="#10253c" stroke="#62e8da" stroke-width="2"/><text x="22" y="37" fill="#fff" font-size="16">z = (x − m) / s</text><text x="22" y="69" fill="#75f2e2" font-size="22">q = min(|z| / zₘₐₓ, 1)</text><text x="22" y="90" fill="#c8d6ec" font-size="12">The clipped magnitude is unitless.</text></g><text x="32" y="235" fill="#c7e5f2" font-size="14">The twin compares rolling and frozen-reference deviation, then clips the larger absolute value.</text><text x="32" y="252" fill="#ffcfdf" font-size="12">Not a probability; thresholds are configurable engineering defaults, not clinical cutoffs.</text></g></svg>
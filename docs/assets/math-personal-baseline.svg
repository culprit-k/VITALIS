<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#161634"/><stop offset="1" stop-color="#123c4a"/></linearGradient></defs><rect width="900" height="260" rx="24" fill="url(#p)"/><g font-family="Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="21" font-weight="700">05 / Patient-baseline features (VITALIS-PB)</text><text x="32" y="66" fill="#d2d8f2" font-size="14">For each row, use only valid earlier observations: no future information in the personal baseline.</text><g transform="translate(38 91)"><rect width="200" height="105" rx="16" fill="#102944" stroke="#62e6d8" stroke-width="2"/><text x="18" y="29" fill="#fff" font-size="15" font-weight="700">PAST OBSERVATIONS</text><path d="M18 75L42 61L66 70L90 48L114 64L138 58L162 68L182 55" fill="none" stroke="#63e5d8" stroke-width="3" stroke-linecap="round"/><circle cx="182" cy="55" r="5" fill="#fff"><animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/></circle></g><path d="M253 143h34m-10 -9 10 9-10 9" fill="none" stroke="#83eee4" stroke-width="4"/><g transform="translate(300 91)"><rect width="230" height="105" rx="16" fill="#252149" stroke="#baa6ff" stroke-width="2"/><text x="18" y="29" fill="#fff" font-size="15" font-weight="700">CAUSAL FEATURES</text><text x="18" y="57" fill="#ddd3ff" font-size="16">baseline = median(past)</text><text x="18" y="80" fill="#ddd3ff" font-size="16">deviation = x − baseline</text></g><path d="M545 143h34m-10 -9 10 9-10 9" fill="none" stroke="#83eee4" stroke-width="4"/><g transform="translate(592 91)"><rect width="270" height="105" rx="16" fill="#102944" stroke="#ff8fbb" stroke-width="2"/><text x="18" y="29" fill="#fff" font-size="15" font-weight="700">SUPERVISED MODEL</text><text x="18" y="56" fill="#ffd6e6" font-size="16">current + lag + delta</text><text x="18" y="79" fill="#ffd6e6" font-size="16">+ trailing mean + PB features</text></g><text x="32" y="227" fill="#cedaf2" font-size="13">A logistic-regression model is fitted on training patients; preprocessing is fitted on training folds.</text><text x="32" y="246" fill="#ffcddf" font-size="12">A causal feature generator is a research experiment, not proof of clinical utility or novelty.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235"><defs><linearGradient id="sb" x2="1" y2="1"><stop stop-color="#10162e"/><stop offset="1" stop-color="#1e1946"/></linearGradient></defs><rect width="900" height="235" rx="24" fill="url(#sb)"/><g font-family="Arial,sans-serif"><text x="30" y="36" fill="#fff" font-size="21" font-weight="700">Project status at a glance</text><g transform="translate(30 57)"><rect width="200" height="118" rx="16" fill="#123c42" stroke="#5de6d7" stroke-width="2"/><circle cx="20" cy="22" r="6" fill="#5de6d7"><animate attributeName="r" values="5;8;5" dur="1.7s" repeatCount="indefinite"/></circle><text x="38" y="27" fill="#fff" font-size="14" font-weight="700">SOFTWARE</text><text x="16" y="58" fill="#c7f6ef" font-size="15">Research code</text><text x="16" y="80" fill="#c7f6ef" font-size="15">and tests exist</text><text x="16" y="103" fill="#9cece1" font-size="12">Reproduce current head</text></g><g transform="translate(250 57)"><rect width="200" height="118" rx="16" fill="#27214a" stroke="#b8a2ff" stroke-width="2"/><circle cx="20" cy="22" r="6" fill="#b8a2ff"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="38" y="27" fill="#fff" font-size="14" font-weight="700">DEMONSTRATIONS</text><text x="16" y="58" fill="#e1d8ff" font-size="15">Synthetic signals</text><text x="16" y="80" fill="#e1d8ff" font-size="15">only in live demos</text><text x="16" y="103" fill="#d3c7ff" font-size="12">Not patient monitoring</text></g><g transform="translate(470 57)"><rect width="200" height="118" rx="16" fill="#3b2c19" stroke="#f8cf6a" stroke-width="2"/><circle cx="20" cy="22" r="6" fill="#f8cf6a"/><text x="38" y="27" fill="#fff" font-size="14" font-weight="700">HARDWARE</text><text x="16" y="58" fill="#f6e6bf" font-size="15">Wristband / PCB</text><text x="16" y="80" fill="#f6e6bf" font-size="15">not yet built</text><text x="16" y="103" fill="#eed6a1" font-size="12">Concept architecture</text></g><g transform="translate(690 57)"><rect width="180" height="118" rx="16" fill="#3e213b" stroke="#ff8eb8" stroke-width="2"/><circle cx="20" cy="22" r="6" fill="#ff8eb8"><animate attributeName="r" values="5;8;5" dur="1.9s" repeatCount="indefinite"/></circle><text x="38" y="27" fill="#fff" font-size="14" font-weight="700">CLINICAL EVIDENCE</text><text x="16" y="58" fill="#ffd0e1" font-size="15">External validation</text><text x="16" y="80" fill="#ffd0e1" font-size="15">not completed</text><text x="16" y="103" fill="#f0bed1" font-size="12">Research only</text></g><text x="30" y="211" fill="#d0dcf3" font-size="13">A software milestone is not the same thing as a validated clinical system.</text></g></svg>
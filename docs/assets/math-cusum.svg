<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><defs><linearGradient id="c" x2="1" y2="1"><stop stop-color="#21122f"/><stop offset="1" stop-color="#401b42"/></linearGradient></defs><rect width="900" height="280" rx="24" fill="url(#c)"/><g font-family="Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="21" font-weight="700">03 / Catch gradual shifts with CUSUM</text><text x="32" y="65" fill="#ead2ec" font-size="14">A frozen reference helps reveal a sustained drift that a rolling baseline might adapt away.</text><g stroke="#60405f" stroke-width="1"><path d="M58 94V220H505"/><path d="M58 125H505M58 157H505M58 189H505" stroke-dasharray="4 5"/></g><path d="M70 171L105 166L140 174L175 164L210 170L245 149L280 139L315 130L350 115L385 106L420 99L455 92L490 86" fill="none" stroke="#ff86bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 122H505" stroke="#ffd166" stroke-width="2" stroke-dasharray="8 6"/><text x="500" y="114" fill="#ffe19a" text-anchor="end" font-size="12">illustrative threshold h</text><circle cx="350" cy="115" r="7" fill="#fff"><animate attributeName="r" values="5;9;5" dur="1.2s" repeatCount="indefinite"/></circle><g transform="translate(540 95)"><rect width="320" height="120" rx="18" fill="#2b1837" stroke="#ff94c4" stroke-width="2"/><text x="22" y="32" fill="#fff" font-size="17" font-weight="700">Two running sums</text><text x="22" y="62" fill="#ffd2e7" font-size="17">C⁺ₜ = max(0, C⁺ₜ₋₁ + z⁰ₜ − k)</text><text x="22" y="89" fill="#ffd2e7" font-size="17">C⁻ₜ = max(0, C⁻ₜ₋₁ − z⁰ₜ − k)</text><text x="22" y="108" fill="#e6bfd9" font-size="12">Check max(C⁺, C⁻) against h</text></g><text x="32" y="250" fill="#f2d9ee" font-size="13">Positive and negative cumulative departures are tracked separately.</text><text x="32" y="267" fill="#ffccd8" font-size="12">k and h need validation; this drawing is illustrative, not an alert prescription.</text></g></svg>
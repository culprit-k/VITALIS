<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs><linearGradient id="s" x2="1" y2="1"><stop stop-color="#10162c"/><stop offset="1" stop-color="#073c53"/></linearGradient></defs><rect width="900" height="260" rx="24" fill="url(#s)"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="32" y="36" fill="#fff" font-size="21" font-weight="700" text-anchor="start">From measurements to a research view</text><g transform="translate(32 63)"><rect width="170" height="122" rx="16" fill="#132844" stroke="#5be7d6" stroke-width="2"/><text x="85" y="28" fill="#fff" font-size="15" font-weight="700">OBSERVATIONS</text><path d="M15 74h21l10-23 14 45 15-32 12 10h62" fill="none" stroke="#5be7d6" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="74" r="4" fill="#fff"><animate attributeName="cx" values="15;145;15" dur="3s" repeatCount="indefinite"/></circle><text x="85" y="105" fill="#c8e5f0" font-size="12">or synthetic signals</text></g><path d="M208 124h33m-9 -8 9 8-9 8" fill="none" stroke="#76f2e6" stroke-width="4"/><g transform="translate(250 63)"><rect width="170" height="122" rx="16" fill="#20234a" stroke="#b39cff" stroke-width="2"/><text x="85" y="28" fill="#fff" font-size="15" font-weight="700">QUALITY GATE</text><circle cx="85" cy="64" r="22" fill="none" stroke="#b39cff" stroke-width="3"/><path d="M74 64l8 8 15-18" fill="none" stroke="#d5c7ff" stroke-width="4" stroke-linecap="round"/><text x="85" y="105" fill="#d7d2f6" font-size="12">units · time · coverage</text></g><path d="M426 124h33m-9 -8 9 8-9 8" fill="none" stroke="#76f2e6" stroke-width="4"/><g transform="translate(468 63)"><rect width="170" height="122" rx="16" fill="#34203f" stroke="#ff91bd" stroke-width="2"/><text x="85" y="28" fill="#fff" font-size="15" font-weight="700">MODEL STUDY</text><path d="M16 79L38 69L58 75L78 57L98 68L118 46L151 54" fill="none" stroke="#ff9abd" stroke-width="3" stroke-linecap="round"/><circle cx="118" cy="46" r="6" fill="#fff"><animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/></circle><text x="85" y="105" fill="#f5d4e1" font-size="12">baseline · deviations</text></g><path d="M644 124h33m-9 -8 9 8-9 8" fill="none" stroke="#76f2e6" stroke-width="4"/><g transform="translate(686 63)"><rect width="180" height="122" rx="16" fill="#143d47" stroke="#fcd16a" stroke-width="2"/><text x="90" y="28" fill="#fff" font-size="15" font-weight="700">REVIEW</text><path d="M18 89V46M18 89H160" stroke="#517d87" stroke-width="2"/><path d="M24 80L52 72L77 76L105 58L130 64L155 43" fill="none" stroke="#fcd16a" stroke-width="3"/><text x="90" y="105" fill="#d4e9ec" font-size="12">interpret with care</text></g><text x="32" y="223" fill="#c9e1ef" font-size="13" text-anchor="start">Illustrative architecture. A visual pattern is not itself a diagnosis or a clinical alarm.</text><text x="32" y="243" fill="#ffccdc" font-size="12" text-anchor="start">Only generated data are used in the streaming demo; physical patient acquisition is not implemented.</text></g></svg>
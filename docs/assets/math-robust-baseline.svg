<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10152d"/><stop offset="1" stop-color="#242052"/></linearGradient></defs><rect width="900" height="280" rx="24" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="35" y="42" fill="#fff" font-size="21" font-weight="700">01 / Robust personal baseline</text><text x="35" y="68" fill="#c9d4f0" font-size="14">Median + MAD reduce the influence of an isolated extreme value.</text><g stroke="#344366" stroke-width="1"><path d="M58 100V220H470"/><path d="M58 140H470M58 180H470" stroke-dasharray="4 5"/></g><path d="M75 167L115 157L155 162L195 153L235 160L275 155L315 161L355 158L395 154L435 162" fill="none" stroke="#57e8d5" stroke-width="3" stroke-linecap="round"/><path d="M75 160H435" stroke="#bca6ff" stroke-width="3" stroke-dasharray="8 6"/><text x="76" y="239" fill="#a9b7d8" font-size="12">Earlier valid observations</text><circle cx="275" cy="155" r="7" fill="#fff"><animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="395" cy="154" r="7" fill="#fff"/><path d="M435 162L455 92" stroke="#ff8ab5" stroke-width="3" stroke-dasharray="5 5"/><circle cx="455" cy="92" r="8" fill="#ff8ab5"><animate attributeName="cy" values="92;82;92" dur="1.8s" repeatCount="indefinite"/></circle><text x="380" y="84" fill="#ffb0cb" font-size="12">Outlier</text><g transform="translate(520 93)"><rect width="345" height="130" rx="18" fill="#171e3e" stroke="#63e7d8" stroke-width="2"/><text x="24" y="34" fill="#fff" font-size="16" font-weight="700">Center</text><text x="24" y="61" fill="#aeece7" font-size="22">m = median(history)</text><text x="24" y="88" fill="#fff" font-size="16" font-weight="700">Robust scale</text><text x="24" y="112" fill="#c9b9ff" font-size="21">s = max(1.4826 × MAD, ε)</text></g><text x="520" y="247" fill="#c5d1ef" font-size="13">History is from earlier accepted values only.</text><text x="35" y="265" fill="#ffcfdf" font-size="12">Illustration only — ε is a numerical floor, not a validated sensor or clinical threshold.</text></g></svg>
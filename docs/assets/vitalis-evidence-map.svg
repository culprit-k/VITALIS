<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"><defs><linearGradient id="ev" x2="1" y2="1"><stop stop-color="#11162d"/><stop offset="1" stop-color="#0d4051"/></linearGradient></defs><rect width="900" height="240" rx="24" fill="url(#ev)"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="30" y="35" fill="#fff" font-size="21" font-weight="700" text-anchor="start">How to read a VITALIS result</text><g transform="translate(30 60)"><rect width="190" height="112" rx="16" fill="#14283f" stroke="#5ce6d6" stroke-width="2"/><text x="95" y="30" fill="#fff" font-size="15" font-weight="700">SOURCE + CONFIG</text><text x="95" y="57" fill="#b8f7ed" font-size="13">code commit</text><text x="95" y="77" fill="#b8f7ed" font-size="13">dataset / split</text><text x="95" y="97" fill="#b8f7ed" font-size="13">seed / environment</text></g><path d="M227 116h32m-8 -8 8 8-8 8" fill="none" stroke="#72eee1" stroke-width="4"/><g transform="translate(266 60)"><rect width="180" height="112" rx="16" fill="#26204b" stroke="#b9a4ff" stroke-width="2"/><text x="90" y="30" fill="#fff" font-size="15" font-weight="700">SPLIT SAFEGUARDS</text><text x="90" y="57" fill="#d8ceff" font-size="13">patient-disjoint</text><text x="90" y="77" fill="#d8ceff" font-size="13">training-only fitting</text><text x="90" y="97" fill="#d8ceff" font-size="13">held-out evaluation</text></g><path d="M453 116h32m-8 -8 8 8-8 8" fill="none" stroke="#72eee1" stroke-width="4"/><g transform="translate(492 60)"><rect width="180" height="112" rx="16" fill="#3a233d" stroke="#ff91ba" stroke-width="2"/><text x="90" y="30" fill="#fff" font-size="15" font-weight="700">METRICS</text><path d="M31 85V48M31 85H150" stroke="#7c607c" stroke-width="2"/><path d="M40 76L63 65L85 70L108 54L137 61" fill="none" stroke="#ff9cc1" stroke-width="3"><animate attributeName="stroke-dasharray" values="1,220;100,120;220,1" dur="3.2s" repeatCount="indefinite"/></path></g><path d="M679 116h32m-8 -8 8 8-8 8" fill="none" stroke="#72eee1" stroke-width="4"/><g transform="translate(718 60)"><rect width="152" height="112" rx="16" fill="#3a321e" stroke="#fbd16a" stroke-width="2"/><text x="76" y="30" fill="#fff" font-size="15" font-weight="700">INTERPRET</text><text x="76" y="57" fill="#fae7bb" font-size="13">uncertainty</text><text x="76" y="77" fill="#fae7bb" font-size="13">limitations</text><text x="76" y="97" fill="#fae7bb" font-size="13">provenance</text></g><text x="30" y="211" fill="#d1e5f0" font-size="13" text-anchor="start">A headline metric without its split, source commit, and limitations is not the whole result.</text></g></svg>
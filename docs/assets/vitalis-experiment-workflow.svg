<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250"><defs><linearGradient id="w" x2="1" y2="1"><stop stop-color="#11172f"/><stop offset="1" stop-color="#192b50"/></linearGradient></defs><rect width="900" height="250" rx="24" fill="url(#w)"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="32" y="37" fill="#fff" font-size="21" font-weight="700" text-anchor="start">A reproducible experiment in four steps</text><g transform="translate(35 64)"><rect width="178" height="118" rx="16" fill="#102d41" stroke="#58e6d5" stroke-width="2"/><text x="89" y="30" fill="#fff" font-size="15" font-weight="700">1 · CONFIGURE</text><path d="M40 52h98M40 66h78M40 80h89" stroke="#82f2e5" stroke-width="4" stroke-linecap="round"/><circle cx="91" cy="52" r="5" fill="#fff"><animate attributeName="cx" values="55;120;55" dur="2.5s" repeatCount="indefinite"/></circle><text x="89" y="103" fill="#c9e9ef" font-size="12">record settings</text></g><path d="M220 122h29m-8 -8 8 8-8 8" fill="none" stroke="#7aefdf" stroke-width="4"/><g transform="translate(260 64)"><rect width="178" height="118" rx="16" fill="#252049" stroke="#b59aff" stroke-width="2"/><text x="89" y="30" fill="#fff" font-size="15" font-weight="700">2 · RUN</text><rect x="32" y="47" width="114" height="38" rx="6" fill="#10142b" stroke="#a894ed" stroke-width="2"/><text x="89" y="71" fill="#cdbfff" font-family="monospace" font-size="13">$ pytest</text><text x="89" y="103" fill="#d9d1f5" font-size="12">check code behavior</text></g><path d="M445 122h29m-8 -8 8 8-8 8" fill="none" stroke="#7aefdf" stroke-width="4"/><g transform="translate(485 64)"><rect width="178" height="118" rx="16" fill="#392039" stroke="#ff91bd" stroke-width="2"/><text x="89" y="30" fill="#fff" font-size="15" font-weight="700">3 · EVALUATE</text><path d="M35 84V48M35 84H143" stroke="#8e6d8e" stroke-width="2"/><path d="M43 75L67 63L89 68L110 51L137 57" fill="none" stroke="#ff9abb" stroke-width="3"/><circle cx="110" cy="51" r="5" fill="#fff"><animate attributeName="r" values="3;7;3" dur="1.3s" repeatCount="indefinite"/></circle><text x="89" y="103" fill="#f4d5e3" font-size="12">compare metrics</text></g><path d="M670 122h29m-8 -8 8 8-8 8" fill="none" stroke="#7aefdf" stroke-width="4"/><g transform="translate(710 64)"><rect width="155" height="118" rx="16" fill="#3a321e" stroke="#fbd166" stroke-width="2"/><text x="77" y="30" fill="#fff" font-size="15" font-weight="700">4 · REPORT</text><path d="M48 48h59v39H48zM57 58h40M57 68h30M57 78h35" fill="none" stroke="#ffe5a0" stroke-width="3" stroke-linecap="round"/><text x="77" y="103" fill="#f4e6ca" font-size="12">aggregate only</text></g><text x="32" y="215" fill="#d2def3" font-size="13" text-anchor="start">Pin the environment, run tests, record comparison results, and keep patient-level artifacts private.</text><text x="32" y="234" fill="#ffccd9" font-size="12" text-anchor="start">A passing test suite establishes tested software behavior—not clinical performance.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235"><defs><linearGradient id="v" x2="1" y2="1"><stop stop-color="#12213a"/><stop offset="1" stop-color="#26204e"/></linearGradient></defs><rect width="900" height="235" rx="24" fill="url(#v)"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="32" y="38" fill="#fff" font-size="21" font-weight="700" text-anchor="start">08 / Evidence gates before any clinical translation</text><g transform="translate(32 61)"><rect width="192" height="110" rx="16" fill="#15334a" stroke="#55e4d2" stroke-width="2"/><circle cx="96" cy="28" r="14" fill="none" stroke="#8af5e7" stroke-width="3"/><path d="M88 28l6 6 11-13" fill="none" stroke="#8af5e7" stroke-width="3"/><text x="96" y="60" fill="#fff" font-size="15" font-weight="700">SOFTWARE TESTS</text><text x="96" y="83" fill="#cfe9ef" font-size="12">Causality / missingness</text><text x="96" y="98" fill="#cfe9ef" font-size="12">reset / edge cases</text></g><path d="M231 116h25m-8 -8 8 8-8 8" fill="none" stroke="#70eee0" stroke-width="4"/><g transform="translate(266 61)"><rect width="192" height="110" rx="16" fill="#27234e" stroke="#b59aff" stroke-width="2"/><circle cx="96" cy="28" r="14" fill="none" stroke="#d3c4ff" stroke-width="3"/><path d="M88 28l6 6 11-13" fill="none" stroke="#d3c4ff" stroke-width="3"/><text x="96" y="60" fill="#fff" font-size="15" font-weight="700">REPRODUCE</text><text x="96" y="83" fill="#ded8f7" font-size="12">Pinned environment</text><text x="96" y="98" fill="#ded8f7" font-size="12">fresh run / provenance</text></g><path d="M465 116h25m-8 -8 8 8-8 8" fill="none" stroke="#70eee0" stroke-width="4"/><g transform="translate(500 61)"><rect width="170" height="110" rx="16" fill="#3b273f" stroke="#ff9abd" stroke-width="2"/><circle cx="85" cy="28" r="14" fill="none" stroke="#ffc6d8" stroke-width="3"/><path d="M77 28l6 6 11-13" fill="none" stroke="#ffc6d8" stroke-width="3"/><text x="85" y="60" fill="#fff" font-size="15" font-weight="700">EXTERNAL COHORT</text><text x="85" y="83" fill="#f3d9e3" font-size="12">Independent data</text><text x="85" y="98" fill="#f3d9e3" font-size="12">predeclared protocol</text></g><path d="M677 116h25m-8 -8 8 8-8 8" fill="none" stroke="#70eee0" stroke-width="4"/><g transform="translate(712 61)"><rect width="156" height="110" rx="16" fill="#3d321d" stroke="#ffd166" stroke-width="2"/><circle cx="78" cy="28" r="14" fill="none" stroke="#ffe6a7" stroke-width="3"/><path d="M70 28l6 6 11-13" fill="none" stroke="#ffe6a7" stroke-width="3"/><text x="78" y="60" fill="#fff" font-size="15" font-weight="700">GOVERNANCE</text><text x="78" y="83" fill="#f5e7c8" font-size="12">Independent review</text><text x="78" y="98" fill="#f5e7c8" font-size="12">safety / permissions</text></g><text x="32" y="208" fill="#d4e1f5" font-size="13" text-anchor="start">These are separate gates. Passing a software test does not establish clinical validity or approval.</text></g></svg>
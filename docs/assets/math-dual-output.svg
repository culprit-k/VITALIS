<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250"><defs><linearGradient id="d" x2="1" y2="1"><stop stop-color="#10162d"/><stop offset="1" stop-color="#152d46"/></linearGradient></defs><rect width="900" height="250" rx="24" fill="url(#d)"/><g font-family="Arial,sans-serif"><text x="32" y="38" fill="#fff" font-size="21" font-weight="700">07 / Two outputs. Two meanings. Never blend them.</text><g transform="translate(40 67)"><rect width="340" height="120" rx="18" fill="#102d3d" stroke="#54e4d4" stroke-width="2"/><text x="22" y="31" fill="#fff" font-size="18" font-weight="700">ADAPTIVE TWIN</text><text x="22" y="57" fill="#8af2e6" font-size="15">Unitless deviation heuristic</text><text x="22" y="80" fill="#c8e5ed" font-size="13">Baseline · coverage · persistence</text><text x="22" y="101" fill="#c8e5ed" font-size="13">Cross-system pattern · trajectory</text></g><g transform="translate(520 67)"><rect width="340" height="120" rx="18" fill="#241c43" stroke="#bb9dff" stroke-width="2"/><text x="22" y="31" fill="#fff" font-size="18" font-weight="700">SUPERVISED MODEL</text><text x="22" y="57" fill="#d1bcff" font-size="15">Retrospective model probability</text><text x="22" y="80" fill="#d7d5ee" font-size="13">Forecast label-window entry at H</text><text x="22" y="101" fill="#d7d5ee" font-size="13">Requires fitted model + feature schema</text></g><path d="M390 127h120" stroke="#ff96ba" stroke-width="5" stroke-dasharray="8 8"/><circle cx="450" cy="127" r="23" fill="#451e39" stroke="#ff91b9" stroke-width="3"/><path d="M438 115l24 24M462 115l-24 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="450" y="177" fill="#ffbad0" font-size="12" font-weight="700" text-anchor="middle">NO SCORE FUSION</text><circle cx="450" cy="127" r="28" fill="none" stroke="#ffbad0" stroke-width="2"><animate attributeName="r" values="24;31;24" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.8s" repeatCount="indefinite"/></circle><text x="32" y="222" fill="#d2def0" font-size="14">Keep outputs separate in code, documentation, and interpretation.</text><text x="32" y="240" fill="#ffc7d9" font-size="12">Neither output has been validated for patient-care decisions.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><defs><linearGradient id="m" x2="1" y2="1"><stop stop-color="#10152d"/><stop offset="1" stop-color="#163e57"/></linearGradient></defs><rect width="900" height="270" rx="24" fill="url(#m)"/><g font-family="Arial,sans-serif"><text x="32" y="38" fill="#fff" font-size="21" font-weight="700">VITALIS algorithm map</text><text x="32" y="62" fill="#cbdaf0" font-size="14">Two research tracks answer different questions; neither is a clinical decision engine.</text><g transform="translate(32 91)"><rect width="230" height="100" rx="17" fill="#122e42" stroke="#54e4d4" stroke-width="2"/><text x="115" y="30" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">STREAM INPUT</text><text x="115" y="54" fill="#a5f5eb" text-anchor="middle" font-size="13">valid observations + history</text><text x="115" y="75" fill="#c9dce8" text-anchor="middle" font-size="12">timestamp · unit · quality</text></g><path d="M268 141h42m-10 -9 10 9-10 9" fill="none" stroke="#80f3e6" stroke-width="4"/><g transform="translate(320 82)"><rect width="250" height="72" rx="15" fill="#173c4c" stroke="#60e9d8" stroke-width="2"/><text x="125" y="27" fill="#fff" text-anchor="middle" font-size="15" font-weight="700">ADAPTIVE TWIN</text><text x="125" y="49" fill="#b7f7ed" text-anchor="middle" font-size="12">median/MAD · z-score · CUSUM</text><text x="125" y="64" fill="#b7f7ed" text-anchor="middle" font-size="12">system mean · EWMA</text></g><g transform="translate(320 169)"><rect width="250" height="72" rx="15" fill="#2a204a" stroke="#b9a3ff" stroke-width="2"/><text x="125" y="27" fill="#fff" text-anchor="middle" font-size="15" font-weight="700">SUPERVISED ML</text><text x="125" y="49" fill="#ded3ff" text-anchor="middle" font-size="12">causal temporal / PB features</text><text x="125" y="64" fill="#ded3ff" text-anchor="middle" font-size="12">logistic regression · horizons</text></g><path d="M570 118h42v49h-42M570 205h42v-38" fill="none" stroke="#7eede0" stroke-width="3"/><g transform="translate(625 112)"><rect width="235" height="99" rx="17" fill="#33213f" stroke="#ff91bc" stroke-width="2"/><text x="117" y="28" fill="#fff" text-anchor="middle" font-size="16" font-weight="700">RESEARCH REPORT</text><text x="117" y="51" fill="#ffd0e1" text-anchor="middle" font-size="13">separate semantics</text><text x="117" y="72" fill="#ffd0e1" text-anchor="middle" font-size="12">metrics · uncertainty · limits</text></g><circle cx="288" cy="141" r="5" fill="#fff"><animate attributeName="cx" values="268;306;268" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="600" cy="118" r="5" fill="#fff"><animate attributeName="cy" values="118;205;118" dur="2.8s" repeatCount="indefinite"/></circle><text x="32" y="257" fill="#ffcedf" font-size="12">Research design overview only — the twin heuristic and supervised model outputs must not be fused.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><defs><linearGradient id="e" x2="1" y2="1"><stop stop-color="#0b2334"/><stop offset="1" stop-color="#16204a"/></linearGradient></defs><rect width="900" height="280" rx="24" fill="url(#e)"/><g font-family="Arial,sans-serif"><text x="32" y="39" fill="#fff" font-size="21" font-weight="700">04 / Combine systems, smooth the trajectory</text><text x="32" y="65" fill="#c8e5f2" font-size="14">Average channels within each represented system, then give each system equal weight.</text><g transform="translate(32 91)"><rect width="220" height="125" rx="16" fill="#102d41" stroke="#4be4d4" stroke-width="2"/><text x="16" y="27" fill="#fff" font-size="15" font-weight="700">SYSTEM SCORES</text><text x="16" y="55" fill="#7bf4e5" font-size="14">Cardiovascular</text><rect x="16" y="64" width="180" height="9" rx="4" fill="#25485a"/><rect x="16" y="64" width="125" height="9" rx="4" fill="#4be4d4"><animate attributeName="width" values="70;125;96;125" dur="3s" repeatCount="indefinite"/></rect><text x="16" y="94" fill="#c9b9ff" font-size="14">Respiratory</text><rect x="16" y="102" width="180" height="9" rx="4" fill="#25485a"/><rect x="16" y="102" width="80" height="9" rx="4" fill="#bba6ff"><animate attributeName="width" values="45;80;110;80" dur="2.6s" repeatCount="indefinite"/></rect></g><path d="M270 152h42m-10 -9 10 9-10 9" stroke="#83eee4" stroke-width="4" fill="none"/><g transform="translate(330 91)"><rect width="195" height="125" rx="16" fill="#132744" stroke="#b6a0ff" stroke-width="2"/><text x="16" y="27" fill="#fff" font-size="15" font-weight="700">EQUAL-WEIGHT</text><text x="16" y="48" fill="#fff" font-size="15" font-weight="700">MEAN</text><text x="16" y="79" fill="#c9b9ff" font-size="20">uₜ = mean(Qg,t)</text><text x="16" y="103" fill="#c3d1e8" font-size="12">Across systems, not channels</text></g><path d="M542 152h42m-10 -9 10 9-10 9" stroke="#83eee4" stroke-width="4" fill="none"/><g transform="translate(600 91)"><rect width="267" height="125" rx="16" fill="#102d41" stroke="#ff8cb8" stroke-width="2"/><text x="16" y="27" fill="#fff" font-size="15" font-weight="700">EWMA SMOOTHING</text><text x="16" y="54" fill="#ffd2e6" font-size="17">Sₜ = αuₜ + (1−α)Sₜ₋₁</text><path d="M18 96L40 83L62 103L84 74L106 98L128 72L150 82L172 60L194 71L216 48L246 58" fill="none" stroke="#4be4d4" stroke-width="2" opacity=".65"/><path d="M18 96C44 88 56 93 84 88S119 82 150 78S194 70 246 60" fill="none" stroke="#ff8cb8" stroke-width="4" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="1,400;240,160;400,1" dur="3s" repeatCount="indefinite"/></path></g><text x="32" y="247" fill="#c8e5f2" font-size="13">Eligibility also requires sufficient coverage, scored channels and represented systems.</text><text x="32" y="265" fill="#ffcedd" font-size="12">α, minimum counts and score rules are engineering defaults—not clinically trained weights.</text></g></svg>
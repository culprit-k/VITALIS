<text x="38" y="99" font-family="Arial,sans-serif" font-size="25" fill="#f8fafc">bᵢⱼₜ = median { xᵢⱼτ : τ &lt; t }</text>
<text x="38" y="147" font-family="Arial,sans-serif" font-size="25" fill="#f8fafc">dᵢⱼₜ = xᵢⱼₜ − bᵢⱼₜ</text>
